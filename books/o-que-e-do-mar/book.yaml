kdp:
  description: |
    Na noite da maior maré do ano, a muralha que Joana projetou para proteger
    a cidade baixa de Thalassa é galgada, e a comporta que ela desenhou cede. O
    mar entra pelas ruas. O pai dela, um velho construtor de barcos, se recusa a
    sair.

    O Conselho declara o bairro zona de recuo: sem água, sem luz, sem ninguém.
    Mas trezentas pessoas ficam. Moram nos telhados, fazem água doce com janelas
    velhas, e começam a construir casas que sobem e descem com a maré. Joana, a
    engenheira da muralha que falhou, tem de aprender com elas tudo o que não
    estava nos livros.

    Então chega uma empresa com a muralha que ela sempre quis fazer: seis metros,
    bombas, prédios secos. A chance de consertar o passado. Só que alguém vai
    pagar por ela.

    Um romance de ficção científica sobre o mar que sobe, uma cidade que aprende
    a subir junto, e a diferença entre segurar uma coisa e deixá-la passar.
