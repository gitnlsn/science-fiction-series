kdp:
  description: |
    On the night a storm drives a spring tide against the coast, the seawall Joana
    designed to protect the lower city of Thalassa is overtopped, and the gate she
    drew up herself gives way. The sea comes in through the streets. Her father, an old boatbuilder,
    refuses to leave.

    The Council declares the neighborhood a retreat zone: no water, no power, no
    one. But three hundred people stay. They live on the rooftops, make fresh
    water with old windows, and begin to build houses that rise and fall with the
    tide. Joana, the engineer of the wall that failed, has to learn from them
    everything that wasn't in the books.

    Then a company arrives with the wall she always wanted to build: six meters,
    pumps, dry buildings. The chance to put the past right. Except that someone
    is going to pay for it.

    A science fiction novel about a rising sea, a city that learns to rise with
    it, and the difference between holding something back and letting it through.
  keywords:
