kdp:
  description: |
    Twenty thousand kilometers up, a person weighs three kilos, and anything that
    comes loose from the cable falls, slowly, until it burns in the sky.

    Iara is a maintenance technician on the world's only space elevator: a ribbon
    thinner than paper that rises from the middle of the sea to beyond orbit. On a
    routine climb, she finds a body fastened to the ribbon. It is Otávio, the man
    who trained her. He was supposed to be on leave, on a ship. He is tied on with
    a knot only he tied, with an extra turn that holds nothing.

    Let go up there, no one would ever have found him. He wanted to be found. By her.

    Suspended, and carrying a call she didn't answer, Iara climbs again, in hiding,
    to find out what he marked with his own body, while the world below depends on
    the cable to keep from dying of heat.

    The Extra Turn is a mystery without a villain, about a tired ribbon, a report
    nobody read, and what we do with the questions that will never have an answer.
