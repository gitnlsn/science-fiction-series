kdp:
  description: |
    In 2031, Helena was thirty-eight, with an illness that would reach her mind
    within weeks and a six-year-old daughter. She chose the day. She donated her
    brain to research. She didn't expect to wake up.

    She wakes in 2140, in a body grown from her own DNA: her face, without any of
    the scars life had left on it. The city has been remade against the heat and
    the water. Nobody walks in the street when it rains. Nobody knows what an
    umbrella is anymore.

    And her daughter is alive. She is a hundred and fifteen.

    She is the one who paid, with everything the family had. And she won't say
    why.

    After Me is a novel about a mother younger than her own daughter, about what
    you promise a child sitting on a high bed, and about what is left of a person
    when something else remakes her from a record.
