kdp:
  description: |
    A vinte mil quilômetros de altura, uma pessoa pesa três quilos, e tudo o que
    se solta do cabo cai, devagar, até queimar no céu.

    Iara é técnica de manutenção do único elevador espacial do mundo: uma fita
    mais fina que papel que sobe do meio do mar até além da órbita. Numa subida
    de rotina, ela encontra um corpo preso à fita. É Otávio, o homem que a
    formou. Ele devia estar de folga, num navio. Está amarrado com um nó que só
    ele dava, com uma volta a mais que não segura nada.

    Solto ali, ninguém o teria achado. Ele quis ser encontrado. Por ela.

    Suspensa e carregando uma ligação que não atendeu, Iara sobe de novo,
    escondida, para descobrir o que ele marcou com o próprio corpo, enquanto o
    mundo lá embaixo depende do cabo para não morrer de calor.

    A volta a mais é um mistério sem vilão, sobre uma fita cansada, um relatório
    que ninguém leu, e o que se faz com as perguntas que nunca vão ter resposta.
  keywords:
    - ficção científica
    - mistério
    - elevador espacial
    - ficção científica hard
    - luto
    - mudança climática
    - ficção literária
