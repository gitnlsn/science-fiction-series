kdp:
  description: |
    Em 2031, Helena tinha trinta e oito anos, uma doença que ia chegar à cabeça
    em poucas semanas e uma filha de seis. Escolheu o dia. Doou o cérebro para a
    pesquisa. Não esperava acordar.

    Acorda em 2140, num corpo cultivado a partir do próprio DNA: o rosto dela,
    sem nenhuma das cicatrizes que a vida tinha deixado. A cidade foi refeita
    contra o calor e a água. Ninguém anda na rua quando chove. Ninguém sabe mais
    o que é um guarda-chuva.

    E a filha está viva. Tem cento e quinze anos.

    Foi ela quem pagou, com tudo o que a família tinha. E não diz por quê.

    Depois de mim é um romance sobre uma mãe mais nova que a própria filha, sobre
    o que se promete a uma criança sentada numa cama alta, e sobre o que sobra de
    uma pessoa quando outra coisa a refaz a partir de um registro.
  keywords:
